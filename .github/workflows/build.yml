name: Test Compile

on:
  push:
    paths:
      - 'jocktos/**'
    branches:
      - c_based_scheduler
  pull_request:
    branches:
      - c_based_scheduler
    paths:
      - 'jocktos/**'

jobs:
  build: 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        example: [default]
        board: [STM32F303xE]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-arm-none-eabi

    - name: Configure Cmake
      run: |
        cmake -S . -B build/${{ matrix.build_type }} \
          -DEXAMPLE=${{ matrix.example }} \
          -DBOARD=${{ matrix.board }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type}} \
          -DCMAKE_TOOLCHAIN_FILE=arm-none-eabi-gcc.cmake

    - name: Build
      run: cmake --build build/${{ matrix.build_type }} --verbose

      
