name: Test Compile

on:
  push:
    paths:
      - 'jocktos/**'
    branches:
      - c_based_scheduler
  pull_request:
    branches:
      - c_based_scheduler
    paths:
      - 'jocktos/**'

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-arm-none-eabi

    - name: Build JOCKTOS debug
      run: cd jocktos && cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=arm-none-eabi-gcc.cmake && cd build/release && make
    - name: Build JOCKTOS Release
      run: cd jocktos && cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=arm-none-eabi-gcc.cmake && cd build/debug && make

   

      
