name: Test Build Docs

on:
  push:
    paths:
      - 'docs/**'
      - 'jocktos/**'
    branches:
      - c_based_scheduler
  pull_request:
    branches:
      - c_based_scheduler
    paths:
      - 'docs/**'
      - 'jocktos/**'
  
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [html, latexpdf]
        include:
          - build_type: latexpdf
            dir: latex

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        python3-sphinx \
        python3-sphinx-rtd-theme \
        python3-breathe \
        doxygen \
        graphviz \
        texlive-xetex \
        latexmk \
        fonts-freefont-otf \
        xindy

    - name: Build ${{ matrix.build_type }} docs
      run: |
        cd docs
        make ${{ matrix.build_type }}

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload pages
      if: matrix.build_type == 'html'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/build/${{ matrix.dir || matrix.build_type }}
        name: pages-${{ matrix.build_type }}

    - name: Upload artifacts
      if: matrix.build_type != 'html'
      uses: actions/upload-artifact@v4
      with:
        path: ./docs/build/${{ matrix.dir || matrix.build_type }}
        name: docs-${{ matrix.build_type }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4